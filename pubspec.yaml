name: onde_gastei_app
description: Aplicativo para registrar despesas pessoais.
publish_to: "none"

version: 1.4.0+22

environment:
  sdk: ">=3.10.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  # google_fonts: ^3.0.1
  flutter_screenutil: ^5.9.3
  dio: ^5.9.0
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4
  firebase_auth: ^6.1.3
  firebase_core: ^4.3.0
  flutter_dotenv: ^6.0.0
  firebase_remote_config: ^6.1.3
  logger: ^2.5.0
  # asuka: ^2.0.0+1
  # validatorless: ^1.2.1
  intl: ^0.20.2
  fl_chart: ^1.1.1
  grouped_list: ^6.0.0
  firebase_crashlytics: ^5.0.6
  firebase_analytics: ^12.1.0
  firebase_performance: ^0.11.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  mocktail: ^1.0.4
  hard_analyser: ^1.9.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.2
  flutter_flavorizr: ^2.2.3

# dependency_overrides:
#   # Por causa do flutter_localizations
#   intl: ^0.19.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/

  fonts:
    - family: Jost
      fonts:
        - asset: fonts/Jost-Black.ttf
          weight: 900
        - asset: fonts/Jost-Bold.ttf
          weight: 700
        - asset: fonts/Jost-Medium.ttf
          weight: 500
        - asset: fonts/Jost-Regular.ttf
          weight: 400
